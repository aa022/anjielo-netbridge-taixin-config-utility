schema_version = 1
# TaiXin (Taixin / Huge-IC "hgic") AH (802.11ah HaLow) WNB firmware AT command catalog.
# Target: TXW8301 (TXW4002A CK803) WNB bridge firmware v1.6.x (the AT+WNBCFG / AT+MODE=ap|sta family),
# as used in TX-AH-R900P(NR) modules / Anjielo "AH Netbridge". Reachable over UART (115200 8N1, newline mode,
# case-insensitive) and over NetAT UDP 56789 ("same usage as serial" per Taixin docs).
#
# Provenance (all fetched 2026-10-16, no device contacted):
#  * Taixin "AH 模组 AT 指令开发指南" V4.8 (2025-09-18) PDF, in LilyGO T-Halow repo SDK/ folder.
#  * Taixin AH AT guide V3.0 (2022-02-23) PDF on discuss.ardupilot.org.
#  * LilyGO T-Halow-RJ45 docs/AT_cmd.md (English translation of the Taixin guide + extras).
#  * Taixin hgSDK-v1.6.4.3-39706-wnb (LilyGO T-Halow SDK/AH-V1.6-SDK_20260106160634.zip):
#    libwnb.h struct wnb_config, project/main.c, and libtxw4002a.a objects wnb_atcmd.o / lmac_test.o.
#    The authoritative v1.6 command list and per-handler side effects (wnb_save_cfg / mcu_reset /
#    syscfg_loaddef references) were derived by parsing ELF symbols + relocations of those objects
#    (no code executed); LMAC test-table help strings come from the same objects / firmware .rodata.
#  * Firmware strings: huge-ic-ah v1.6.3.3-26347, v1.6.4.3-29063, -38054, -39706 (same 164-171 cmd set).
#  * Taixin-Semiconductor/TXW8301_WNB v2.4.1.3 project/atcmd.c (v2.x set; marked "[v2.x only]").
#  * local:research/taixin_scan_macos.c (commands already exercised against the live unit).
#
# Response formats:
#  * WNB-layer commands (most config): "+NAME:value\r\nOK\r\n" (atcmd_resp macro), errors "ERROR\r\n".
#    Query with "AT+NAME?"; some also accept bare "AT+NAME". e.g. "+TXPOWER:20dbm", "+BSS_BW:8MHz".
#  * LMAC test-table commands (registered as "AT+NAME="): query "AT+NAME=?", plain-text reply such as
#    "tx mcs= 255" / "RSSI=-40" (no +NAME: prefix). An unrecognised AT+ command falls through to this
#    table and prints "valid cmds:" followed by the numbered LMAC command list with help text.
#  * persists: "yes" = handler calls wnb_save_cfg (auto-save; presumably skipped when wnbcfg.not_auto_save=1);
#    "no" for LMAC test-table settings = no save call found in the handler (runtime only, lost on reboot).
#  * safety: "set" commands that change ssid/psk/keymgmt/chan_list/bss_bw/mode drop the radio link
#    (wnb_disassoc_all / retune). Over NetAT that may cut you off from a remote peer.
#
# WNBCFG field -> AT command (v1.6):
#  role=MODE  bss_bw=BSS_BW  encrypt=KEYMGMT  key_set/psk=PSK  mkey_set=MCAST_PSK  join_group,group_aid=JOINGROUP
#  freq_range=FREQ_RANGE  chan_list=CHAN_LIST  ssid=SSID  r_ssid=R_SSID  addr=MAC_ADDR(read)  tx_mcs=TX_MCS
#  tx_power=TXPOWER  psconnect_period,psconnect_roundup=PS_CONNECT  psmode=PS_MODE  acktmo,ack_tmo=ACKTMO
#  beacon_int=BEACON_INT  dtim_period=DTIM  agg_cnt=AGGCNT  roaming=ROAM  dupfilter=DUPFILTER
#  heartbeat_int=HEART_INT  auto_sleep_time=AUTO_SLEEP  ap_psmode=AP_PSMODE  country_region=COUNTRY_REGION
#  standby_channel/period=STANDBY  wait_psmode=WAIT_PSMODE  (runtime LMAC analogues only, not saved:)
#  tx_bw~TX_BW  pri_chan~PRI_CHAN  auto_chsw~CS_EN  max_txcnt~TX_CNT_MAX  mcast_txmcs~MCAST_MCS
#  mcast_txbw~MCAST_BW  mcast_dupcnt~MCAST_DUP  supper_pwr(_dis)~TX_PWR_SUPER  dcdc13~SET_VDD13(?)
#  No AT command found (host-driver HGIC_CMD_* or compile-time only): forward, bssid_set, max_sta, acs_enable,
#  acs_tmo, wkio_mode, bss_max_idle, aplost_time, roam_rssi_th, roam_int, dhcpc_en, dhcp_host, reassoc_wkhost,
#  mcast_filter, auto_role, pa_pwrctrl_dis, pair_autostop, not_auto_save, auto_pair, wkup_io, wkio_edge,
#  dis_1v1_m2u, psconnect_dis, ap_hide (AT+APHIDE is v2.x), roaming_samefreq, repeater_level, mcast_clearch,
#  wkup_host_reason.

[[command]]
name = "MODE"
summary = "WNB role: ap / sta / group (multicast) / apsta (repeater). Reply +MODE:<role>. On bridges with a hardware AP/STA role switch, firmware re-reads the switch at boot and overrides ap/sta (not group/apsta)"
query = ["AT+MODE?", "AT+MODE"]
set = "AT+MODE=<ap|sta|group|apsta>"
args = "ap|sta|group|apsta (case-insensitive)"
safety = "set"
sensitive = false
persists = "yes"
source = "https://github.com/Xinyuan-LilyGO/T-Halow/blob/master/SDK/%E6%B3%B0%E8%8A%AFAH%E6%A8%A1%E7%BB%84AT%E6%8C%87%E4%BB%A4%E5%BC%80%E5%8F%91%E6%8C%87%E5%8D%97.pdf (Taixin AH AT guide V4.8 2025-09-18); https://github.com/Xinyuan-LilyGO/T-Halow/blob/master/SDK/AH-V1.6-SDK_20260106160634.zip (hgSDK-v1.6.4.3-39706-wnb libtxw4002a.a) wnb_atcmd.o reloc analysis; https://github.com/Xinyuan-LilyGO/T-Halow/blob/master/SDK/AH-V1.6-SDK_20260106160634.zip (hgSDK-v1.6.4.3-39706-wnb libtxw4002a.a) project/main.c; local:research/taixin_scan_macos.c"
confidence = "high"

[[command]]
name = "SSID"
summary = "SSID (also used by pairing). Set disassociates all peers, saves, reconnects. Reply +SSID:<ssid>"
query = ["AT+SSID?"]
set = "AT+SSID=<ssid>"
args = "string, < 32 chars"
safety = "set"
sensitive = false
persists = "yes"
source = "https://github.com/Xinyuan-LilyGO/T-Halow/blob/master/SDK/%E6%B3%B0%E8%8A%AFAH%E6%A8%A1%E7%BB%84AT%E6%8C%87%E4%BB%A4%E5%BC%80%E5%8F%91%E6%8C%87%E5%8D%97.pdf (Taixin AH AT guide V4.8 2025-09-18); https://github.com/Xinyuan-LilyGO/T-Halow/blob/master/SDK/AH-V1.6-SDK_20260106160634.zip (hgSDK-v1.6.4.3-39706-wnb libtxw4002a.a) wnb_atcmd.o reloc analysis; local:research/taixin_scan_macos.c"
confidence = "high"

